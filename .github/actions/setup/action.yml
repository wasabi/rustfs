name: "Setup Rust Environment"
description: "Setup Rust development environment with caching for RustFS"

inputs:
  rust-version:
    description: "Rust version to install"
    required: false
    default: "stable"
  cache-shared-key:
    description: "Shared cache key for Rust dependencies"
    required: false
    default: "rustfs-deps"
  cache-save-if:
    description: "Condition for saving cache"
    required: false
    default: "true"
  install-cross-tools:
    description: "Install cross-compilation tools"
    required: false
    default: "false"
  target:
    description: "Target architecture to add"
    required: false
    default: ""
  github-token:
    description: "GitHub token for API access"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Install system dependencies (Ubuntu)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        # Lab runners route apt via apt-cacher-ng (/etc/apt/apt.conf.d/99lab-apt-proxy in lab image).
        # Still cap wall time and per-URI waits so a stuck cache/mirror cannot hang the job forever.
        APT_CONN_OPTS="-o Acquire::http::Timeout=180 -o Acquire::https::Timeout=180 -o Acquire::ftp::Timeout=180 -o Acquire::Retries=3"
        sudo timeout --kill-after=120 30m apt-get $APT_CONN_OPTS update
        sudo timeout --kill-after=120 30m apt-get $APT_CONN_OPTS install -y \
          musl-tools \
          build-essential \
          pkg-config \
          libssl-dev \
          protobuf-compiler

    - name: Install protoc
      uses: rustfs/setup-protoc@v3.0.1
      with:
        version: "29.3"
        repo-token: ${{ github.token }}

    - name: Install flatc
      uses: Nugine/setup-flatc@v1
      with:
        version: "25.12.19"

    # Lab runners ship root-owned /usr/local/{rustup,cargo}; rustup cannot update toolchains there.
    - name: Configure user-writable Rust paths
      uses: ./.github/actions/rust-paths

    - name: Set CARGO_BUILD_JOBS from runner resources
      shell: bash
      run: bash "${GITHUB_WORKSPACE}/scripts/ci/compute-cargo-build-jobs.sh"

    - name: Enable lab sccache (self-hosted)
      if: runner.environment == 'self-hosted'
      shell: bash
      run: |
        set -euo pipefail
        if [[ -f /usr/local/share/lab/lab-rust-sccache-env.sh ]]; then
          # shellcheck disable=SC1091
          source /usr/local/share/lab/lab-rust-sccache-env.sh
        elif [[ -f scripts/lab-sccache-env.sh ]]; then
          # shellcheck disable=SC1091
          source scripts/lab-sccache-env.sh
        fi
        if [[ -n "${GITHUB_ENV:-}" ]]; then
          [[ -n "${RUSTC_WRAPPER:-}" ]] && echo "RUSTC_WRAPPER=${RUSTC_WRAPPER}" >>"$GITHUB_ENV"
          [[ -n "${CARGO_BUILD_RUSTC_WRAPPER:-}" ]] && echo "CARGO_BUILD_RUSTC_WRAPPER=${CARGO_BUILD_RUSTC_WRAPPER}" >>"$GITHUB_ENV"
          [[ -n "${SCCACHE_REDIS:-}" ]] && echo "SCCACHE_REDIS=${SCCACHE_REDIS}" >>"$GITHUB_ENV"
        fi
        if command -v sccache >/dev/null 2>&1; then
          sccache --show-stats || true
        fi

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ inputs.rust-version }}
        targets: ${{ inputs.target }}
        components: rustfmt, clippy

    - name: Install Zig
      if: inputs.install-cross-tools == 'true'
      uses: mlugg/setup-zig@v2

    - name: Install cargo-zigbuild
      if: inputs.install-cross-tools == 'true'
      uses: taiki-e/install-action@cargo-zigbuild

    - name: Install cargo-nextest
      uses: taiki-e/install-action@cargo-nextest

    - name: Setup Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        cache-all-crates: true
        cache-on-failure: true
        shared-key: ${{ inputs.cache-shared-key }}
        save-if: ${{ inputs.cache-save-if }}
